name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify dist artifacts
        run: npm run verify:dist

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: penpot-to-figma-plugin
          path: |
            dist/
            manifest.json
          retention-days: 14
