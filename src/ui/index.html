<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Penpot Import</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      body {
        margin: 0;
        padding: 16px;
        font-size: 13px;
        color: var(--figma-color-text, #1e1e1e);
        background: var(--figma-color-bg, #ffffff);
      }
      h1 {
        font-size: 16px;
        margin: 0 0 8px;
      }
      .dropzone {
        border: 2px dashed var(--figma-color-border, #d0d0d0);
        border-radius: 8px;
        padding: 24px;
        text-align: center;
        cursor: pointer;
        margin-bottom: 12px;
      }
      .dropzone.dragover {
        border-color: var(--figma-color-primary, #0d99ff);
        background: var(--figma-color-bg-secondary, #f5f5f5);
      }
      .options {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 12px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      button {
        width: 100%;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid var(--figma-color-border, #d0d0d0);
        background: var(--figma-color-bg-secondary, #f5f5f5);
        color: inherit;
        cursor: pointer;
        font-size: 13px;
      }
      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }
      #status {
        margin-top: 12px;
        font-size: 12px;
        color: var(--figma-color-text-secondary, #666);
      }
      #warnings {
        margin-top: 12px;
        max-height: 200px;
        overflow-y: auto;
        font-size: 11px;
      }
      .warning {
        padding: 4px 0;
        border-bottom: 1px solid var(--figma-color-border, #eee);
      }
      .progress {
        margin-top: 8px;
        height: 4px;
        background: var(--figma-color-border, #ddd);
        border-radius: 2px;
        overflow: hidden;
      }
      .progress-bar {
        height: 100%;
        background: var(--figma-color-primary, #0d99ff);
        width: 0%;
        transition: width 0.2s;
      }
    </style>
  </head>
  <body>
    <h1>Import Penpot file</h1>
    <div class="dropzone" id="dropzone">
      <p>Drop a <code>.penpot</code> file here or click to browse</p>
      <input type="file" id="fileInput" accept=".penpot,.zip" hidden />
    </div>
    <div class="options">
      <label><input type="checkbox" id="optPages" checked /> Create a Figma page per Penpot page</label>
      <label><input type="checkbox" id="optLibraries" checked /> Import tokens, styles &amp; components</label>
      <label><input type="checkbox" id="optPrototype" checked /> Import prototype interactions</label>
    </div>
    <button id="importBtn" disabled>Import</button>
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
    <div id="status"></div>
    <div id="warnings"></div>
    <script type="module" src="./ui.ts"></script>
  </body>
</html>
